<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>RBlock 3D – R6 Avatar</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { font-family: system-ui, Arial, sans-serif; background: linear-gradient(#75bfff 0 61%, #78c75a 61% 100%); perspective: 900px; }
    .world { position: fixed; inset: 0; overflow: hidden; transform-style: preserve-3d; }
    .sky-glow { position: absolute; top: 7%; right: 12%; width: 90px; height: 90px; border-radius: 50%; background: #ffe97e; box-shadow: 0 0 45px #fff5a5; }
    .cloud { position: absolute; top: 13%; left: 12%; width: 150px; height: 38px; border-radius: 40px; background: #fff; opacity: .85; }
    .cloud::before, .cloud::after { content: ""; position: absolute; bottom: 10px; border-radius: 50%; background: inherit; }
    .cloud::before { left: 25px; width: 55px; height: 55px; }
    .cloud::after { right: 25px; width: 42px; height: 42px; }
    .ground { position: absolute; left: -20%; bottom: -38%; width: 140%; height: 78%; background: linear-gradient(90deg, #0001 1px, transparent 1px), linear-gradient(#64ad4c 1px, transparent 1px), #70be54; background-size: 55px 55px, 55px 55px, auto; transform: rotateX(66deg); transform-origin: bottom center; box-shadow: inset 0 30px 50px #559a42; }

    #avatar { position: absolute; z-index: 3; left: 50%; bottom: 13%; width: 100px; height: 190px; transform: translateX(-50%) rotateY(-12deg); transform-style: preserve-3d; transform-origin: bottom center; }
    .part { position: absolute; border: 2px solid #0003; box-shadow: inset -8px -8px #0003, 5px 8px 8px #0002; transform-style: preserve-3d; }
    .head { top: 0; left: 27px; width: 46px; height: 46px; background: #f2c094; }
    .hair { position: absolute; z-index: 5; top: -4px; left: 24px; width: 52px; height: 17px; background: #56351f; box-shadow: 0 7px #56351f; }
    .face { position: absolute; z-index: 6; top: 18px; left: 38px; width: 5px; height: 6px; background: #222; box-shadow: 18px 0 #222, 7px 16px 0 -1px #934a3b; }
    .torso { top: 49px; left: 19px; width: 62px; height: 68px; background: #1687db; }
    .arm { top: 51px; width: 18px; height: 67px; background: #f2c094; transform-origin: 50% 8px; }
    .arm.left { left: 0; } .arm.right { right: 0; }
    .leg { top: 119px; width: 29px; height: 59px; background: #263d73; transform-origin: 50% 8px; }
    .leg.left { left: 19px; } .leg.right { right: 19px; }
    .shoe { top: 169px; width: 33px; height: 16px; background: #292929; }
    .shoe.left { left: 15px; } .shoe.right { right: 15px; }
    #avatar.walking .arm.left, #avatar.walking .leg.right { animation: swing .28s ease-in-out infinite alternate; }
    #avatar.walking .arm.right, #avatar.walking .leg.left { animation: swing .28s ease-in-out infinite alternate-reverse; }
    @keyframes swing { to { transform: rotate(25deg); } }

    #hint { position: fixed; z-index: 4; top: 14px; left: 50%; transform: translateX(-50%); width: max-content; max-width: 94vw; padding: 9px 14px; border-radius: 10px; background: #17314dcc; color: white; text-align: center; font-weight: 700; }
    #start-screen { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 18px; background: #10243dcc; }
    #start-screen.closed { display: none; }
    .start-card { width: min(440px, 94vw); padding: 25px; border-radius: 20px; background: white; color: #17243a; text-align: center; box-shadow: 0 12px 40px #0005; }
    .start-card h1 { margin: 0 0 8px; }
    .device-icon { min-height: 70px; font-size: 54px; }
    #device-name { font-weight: 800; font-size: 20px; }
    #device-instructions { line-height: 1.5; }
    #start-button { margin-top: 12px; padding: 12px 35px; border: 0; border-radius: 12px; background: #1687db; color: white; font-size: 20px; font-weight: 800; cursor: pointer; }

    .touch-controls { position: fixed; z-index: 5; left: 18px; bottom: 16px; display: none; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(2, 56px); gap: 7px; }
    .touch-controls button { border: 0; border-radius: 14px; background: #ffffffdf; color: #17314d; font-size: 20px; font-weight: 800; box-shadow: 0 3px 8px #0003; touch-action: none; user-select: none; }
    [data-key="w"] { grid-column: 2; grid-row: 1; } [data-key="a"] { grid-column: 1; grid-row: 2; }
    [data-key="s"] { grid-column: 2; grid-row: 2; } [data-key="d"] { grid-column: 3; grid-row: 2; }
    [data-key=" "] { position: fixed; right: 20px; bottom: 22px; width: 76px; height: 76px; border-radius: 50%; background: #1687db; color: white; font-size: 14px; }
    body.phone #hint { display: none; } body.phone .touch-controls { display: grid; }
  </style>
</head>
<body>
  <div class="world">
    <div class="sky-glow"></div><div class="cloud"></div><div class="ground"></div>
  </div>
  <div id="hint">W A S D bewegen · Leertaste springen</div>
  <div id="avatar" aria-label="Blockiger 3D-R6-Avatar">
    <div class="hair"></div><div class="part head"></div><div class="face"></div>
    <div class="part torso"></div><div class="part arm left"></div><div class="part arm right"></div>
    <div class="part leg left"></div><div class="part leg right"></div><div class="part shoe left"></div><div class="part shoe right"></div>
  </div>

  <div class="touch-controls" aria-label="Touch-Steuerung">
    <button type="button" data-key="w">▲</button><button type="button" data-key="a">◀</button>
    <button type="button" data-key="s">▼</button><button type="button" data-key="d">▶</button>
    <button type="button" data-key=" ">SPRUNG</button>
  </div>

  <section id="start-screen" role="dialog" aria-modal="true">
    <div class="start-card">
      <h1>Willkommen!</h1><div id="device-icon" class="device-icon">💻</div>
      <div id="device-name">Laptop erkannt</div>
      <p id="device-instructions">Bewege mit <b>W A S D</b> und springe mit der <b>Leertaste</b>.</p>
      <button id="start-button" type="button">START</button>
    </div>
  </section>

  <script>
    const avatar = document.querySelector('#avatar');
    const keys = new Set();
    const isPhone = matchMedia('(pointer: coarse)').matches || innerWidth < 700;
    if (isPhone) {
      document.body.classList.add('phone');
      document.querySelector('#device-icon').textContent = '📱';
      document.querySelector('#device-name').textContent = 'Telefon erkannt';
      document.querySelector('#device-instructions').innerHTML = 'Steuere mit den <b>Touch-Tasten</b>. Tippe <b>SPRUNG</b> zum Springen.';
    }
    document.querySelector('#start-button').addEventListener('click', () => {
      document.querySelector('#start-screen').classList.add('closed');
    });

    let x = innerWidth / 2, depth = 0, jump = 0, jumpSpeed = 0, facing = 1;
    addEventListener('keydown', event => {
      const key = event.key.toLowerCase();
      if (['w','a','s','d',' '].includes(key)) event.preventDefault();
      keys.add(key);
      if (key === ' ' && jump === 0) jumpSpeed = 13;
    });
    addEventListener('keyup', event => keys.delete(event.key.toLowerCase()));
    addEventListener('blur', () => keys.clear());

    document.querySelectorAll('.touch-controls button').forEach(button => {
      const key = button.dataset.key;
      button.addEventListener('pointerdown', event => {
        event.preventDefault(); button.setPointerCapture(event.pointerId); keys.add(key);
        if (key === ' ' && jump === 0) jumpSpeed = 13;
      });
      const release = event => { event.preventDefault(); keys.delete(key); };
      button.addEventListener('pointerup', release); button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', () => keys.delete(key));
    });

    function update() {
      if (keys.has('a')) { x -= 4; facing = -1; }
      if (keys.has('d')) { x += 4; facing = 1; }
      if (keys.has('w')) depth += 4;
      if (keys.has('s')) depth -= 4;
      x = Math.max(50, Math.min(innerWidth - 50, x));
      depth = Math.max(-innerHeight * .05, Math.min(innerHeight * .23, depth));
      jump += jumpSpeed; jumpSpeed -= .65;
      if (jump < 0) { jump = 0; jumpSpeed = 0; }
      const scale = 1 + depth / (innerHeight * 3);
      avatar.style.left = `${x}px`;
      avatar.style.bottom = `calc(13% + ${depth + jump}px)`;
      avatar.style.transform = `translateX(-50%) scale(${scale}) rotateY(${facing * 12}deg)`;
      avatar.classList.toggle('walking', ['w','a','s','d'].some(key => keys.has(key)));
      requestAnimationFrame(update);
    }
    update();
  </script>
</body>
</html>
